frr version 10.5.3_git
frr defaults traditional
hostname router1
no ipv6 forwarding
!
!
interface eth1
 ip address 192.168.1.254/24
exit
!
interface eth2
 ip address 10.12.0.1/24
exit
!
interface lo
 ip address 1.1.1.1/32
exit
!
router ospf
 network 10.0.0.0/8 area 0.0.0.0
 network 192.168.1.0/24 area 0.0.0.0
exit
