name: frr

topology:
  nodes:
    homer:
      kind: linux
      image: quay.io/frrouting/frr:10.5.3
      binds:
        - homer/daemons:/etc/frr/daemons
        - homer/frr.conf:/etc/frr/frr.conf
    pe1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.3
      binds:
        - pe1/daemons:/etc/frr/daemons
        - pe1/frr.conf:/etc/frr/frr.conf
    p:
      kind: linux
      image: quay.io/frrouting/frr:10.5.3
      binds:
        - p/daemons:/etc/frr/daemons
        - p/frr.conf:/etc/frr/frr.conf
    pe2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.3
      binds:
        - pe2/daemons:/etc/frr/daemons
        - pe2/frr.conf:/etc/frr/frr.conf
    ix:
      kind: linux
      image: quay.io/frrouting/frr:10.5.3
      binds:
        - ix/daemons:/etc/frr/daemons
        - ix/frr.conf:/etc/frr/frr.conf
    pc:
      kind: linux
      image: vnc-desktop:bookworm
      image-pull-policy: Never
      ports:
        - 5900:5900/tcp
      env:
        VNC_PASSWORD: "cisco123"
        VNC_GEOMETRY: "1440x900"
        VNC_DEPTH: "24"
      exec:
        - ip link set eth1 up
        - ip addr add 192.168.1.1/24 dev eth1
        - ip route add 1.0.0.0/24 via 192.168.1.254
        - ip route add 100.0.0.0/8 via 192.168.1.254
    www:
      kind: linux
      image: nginx:1.0
      exec:
        - ip link set eth1 up
        - ip addr add 1.0.0.1/24 dev eth1
        - ip route add 100.0.0.0/8 via 1.0.0.254
  links:
    - endpoints: ["pc:eth1", "homer:eth1"]
    - endpoints: ["homer:eth2", "pe1:eth1"]
    - endpoints: ["pe1:eth2", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:p1"]
    - endpoints: ["pe2:eth2", "ix:eth1"]
    - endpoints: ["ix:eth2", "www:eth1"]
