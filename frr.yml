name: frr

topology:
  nodes:
    homer:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - homer/daemons:/etc/frr/daemons
        - homer/frr.conf:/etc/frr/frr.conf
    pe1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - pe1/daemons:/etc/frr/daemons
        - pe1/frr.conf:/etc/frr/frr.conf
    p:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - p/daemons:/etc/frr/daemons
        - p/frr.conf:/etc/frr/frr.conf
    pe2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - pe2/daemons:/etc/frr/daemons
        - pe2/frr.conf:/etc/frr/frr.conf
    ix:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ix/daemons:/etc/frr/daemons
        - ix/frr.conf:/etc/frr/frr.conf
    pc:
      kind: linux
      image: chrome_vnc:latest
      ports:
        - "5900:5900"
      exec:
        - ip link set dev eth0 down 
    www:
      kind: linux
      image: nginx:1.0
      ports:
        - "8080:80"
      exec:
        - ip link set dev eth0 down 
        - ip addr add 1.0.0.1/24 dev eth1
        - ip route add default via 1.0.0.254
    dns:
      kind: linux
      image: coredns/coredns:latest
      binds:
        - ./Corefile:/Corefile
      cmd: "-conf /Corefile"
      exec:
        - ip link set dev eth0 down 
        - ip addr add 100.0.0.1/24 dev eth1
        - ip route add default via 100.0.0.254
  links:
    - endpoints: ["pc:eth1", "homer:eth1"]
    - endpoints: ["homer:eth2", "pe1:eth1"]
    - endpoints: ["pe1:eth2", "p:eth1"]
    - endpoints: ["p:eth2", "pe2:p1"]
    - endpoints: ["pe:eth2", "ix:eth1"]
    - endpoints: ["ix:eth2", "www:eth1"]
    - endpoints: ["ix:eth3", "dns:eth1"]
